<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Capturing & Bubbling</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
      }
      .container {
        margin: 50px auto;
        padding: 20px;
        width: 300px;
        border: 2px solid black;
        background-color: lightgray;
        position: relative;
      }
      .button {
        padding: 10px;
        background-color: lightblue;
        border: 1px solid blue;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="parent" class="container">
      Parent Div
      <br /><br />
      <button id="child" class="button">Click Me</button>
    </div>

    <script>
      // Capturing phase (Top → Down)
      document.addEventListener(
        "click",
        (e) => {
          console.log("Window - Capturing");
          // e.stopPropagation();
        },
        true
      );
      document.documentElement.addEventListener(
        "click",
        () => console.log("HTML - Capturing"),
        true
      );
      document.body.addEventListener(
        "click",
        () => console.log("Body - Capturing"),
        true
      );
      document
        .getElementById("parent")
        .addEventListener(
          "click",
          () => console.log("Parent - Capturing"),
          true
        );
      document
        .getElementById("child")
        .addEventListener(
          "click",
          () => console.log("Child - Capturing"),
          true
        );

      // Target Phase (Actual Clicked Element)
      document.getElementById("child").addEventListener("click", (e) => {
        e.stopImmediatePropagation();
        console.log("Child - Target");
        console.log("event chain stopped from here");
      });

      // Demonsrate stopImmediatePropagation
      document.getElementById("child").addEventListener("click", () => {
        console.log("Child - Target");
      });

      // Bubbling phase (Bottom → Up)
      document
        .getElementById("child")
        .addEventListener("click", () => console.log("Child - Bubbling"));
      document
        .getElementById("parent")
        .addEventListener("click", () => console.log("Parent - Bubbling"));
      document.body.addEventListener("click", () =>
        console.log("Body - Bubbling")
      );
      document.documentElement.addEventListener("click", () =>
        console.log("HTML - Bubbling")
      );
      document.addEventListener("click", () =>
        console.log("Window - Bubbling")
      );
    </script>
  </body>
</html>
